name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch/PR; superseded runs are cancelled to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # checkout only — no job writes to the repo or its metadata

jobs:
  verify:
    name: Verify (build, format, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Verify
        run: ./scripts/verify.sh

  vulnerable-packages:
    name: Vulnerable-package gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SoloMaster.slnx --locked-mode

      - name: Check for vulnerable packages
        run: |
          dotnet list SoloMaster.slnx package --vulnerable --include-transitive --format json > vuln.json
          count=$(python3 - <<'PY'
          import json
          d = json.load(open('vuln.json'))
          print(sum(
              len(pkg.get('vulnerabilities') or [])
              for proj in d.get('projects', [])
              for fw in proj.get('frameworks') or []
              for key in ('topLevelPackages', 'transitivePackages')
              for pkg in fw.get(key) or []
          ))
          PY
          )
          echo "vulnerabilities found: $count"
          if [ "$count" -gt 0 ]; then
            cat vuln.json
            echo "Vulnerable packages detected — failing build."
            exit 1
          fi

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
