name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

# One run per branch/PR; superseded runs are cancelled to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # default for all jobs — analyze widens only what CodeQL needs

jobs:
  analyze:
    name: CodeQL analyze (Java)
    runs-on: ubuntu-latest
    permissions:
      actions: read # required by CodeQL to read workflow metadata in private repos
      contents: read # checkout
      security-events: write # upload SARIF results to code scanning

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build
        run: ./gradlew --no-daemon compileJava compileTestJava

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
