name: PR description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# One run per PR; superseded runs are cancelled to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ai-attribution:
    name: No AI attribution in PR description
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout of the shared checker script
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PR title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | ./scripts/check-ai-attribution.sh
