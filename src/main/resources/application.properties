spring.application.name=solo-master
# Local-first: listen on loopback only until exposure is an explicit decision.
server.address=127.0.0.1
# Its own default port, so it can run beside other local apps on 8080. SOLOMASTER_PORT overrides it.
server.port=${SOLOMASTER_PORT:8090}
# Local, uncommitted overrides (vault path, API keys) live in config/application-local.properties.
spring.config.import=optional:file:./config/application-local.properties

# Research module (ADR-0004). The vault path and API keys come from the environment or local config.
solomaster.research.vault-path=${SOLOMASTER_VAULT_PATH:}
solomaster.research.transcript.command=.venv-research/bin/python,scripts/research/fetch_transcript.py
solomaster.research.transcript.timeout=60s
solomaster.research.transcript.max-chars=400000
solomaster.research.model-timeout=180s
# Optional (ADR-0004 Amendment 2): a video's title, channel and publish date. Without a key the brief
# is still written, titled by video ID.
solomaster.research.youtube.base-url=https://www.googleapis.com/youtube/v3
solomaster.research.youtube.api-key=${YOUTUBE_API_KEY:}
solomaster.research.youtube.timeout=10s
# Ordered provider chain (ADR-0001): pinned model IDs, Gemini free first, OpenRouter :free fallback.
# Amendment 2 (2026-11-09): each Gemini entry is a different model, because free quota is counted per
# model (gemini-3.7-flash now just forwards to 3.8, sharing its quota); the OpenRouter entries run on
# servers of other companies (NVIDIA, Thinking Machines), so a Google outage or quota cannot take every
# entry down. If a model is retired, the error page names it: replace its ID here.
solomaster.research.providers[0].name=gemini
solomaster.research.providers[0].base-url=https://generativelanguage.googleapis.com/v1beta/openai
solomaster.research.providers[0].model=gemini-3.8-flash
solomaster.research.providers[0].api-key=${GEMINI_API_KEY:}
solomaster.research.providers[1].name=gemini
solomaster.research.providers[1].base-url=https://generativelanguage.googleapis.com/v1beta/openai
solomaster.research.providers[1].model=gemini-3.6-flash
solomaster.research.providers[1].api-key=${GEMINI_API_KEY:}
solomaster.research.providers[2].name=gemini
solomaster.research.providers[2].base-url=https://generativelanguage.googleapis.com/v1beta/openai
solomaster.research.providers[2].model=gemini-3.5-flash-lite
solomaster.research.providers[2].api-key=${GEMINI_API_KEY:}
solomaster.research.providers[3].name=openrouter
solomaster.research.providers[3].base-url=https://openrouter.ai/api/v1
solomaster.research.providers[3].model=nvidia/nemotron-3-ultra-550b-a55b:free
solomaster.research.providers[3].api-key=${OPENROUTER_API_KEY:}
solomaster.research.providers[4].name=openrouter
solomaster.research.providers[4].base-url=https://openrouter.ai/api/v1
solomaster.research.providers[4].model=thinkingmachines/inkling-2-small:free
solomaster.research.providers[4].api-key=${OPENROUTER_API_KEY:}
